<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="afbg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20242c"/>
      <stop offset="100%" stop-color="#0a0c11"/>
    </linearGradient>
    <linearGradient id="afl" x1="50" y1="50" x2="14" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="afr" x1="50" y1="50" x2="86" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="100" height="100" rx="22" fill="url(#afbg)"/>

  <!-- Left face -->
  <polygon points="50,20 18,80 29,80 35,64 43,80 50,80" fill="url(#afl)"/>
  <!-- Right face -->
  <polygon points="50,20 50,80 57,80 65,64 71,80 82,80" fill="url(#afr)"/>
  <!-- Center ridge highlight -->
  <polygon points="50,20 53,52 47,52" fill="#dbeafe" opacity="0.85"/>
  <!-- Apex spark -->
  <circle cx="50" cy="20" r="1.6" fill="#eff6ff"/>
</svg>
